# Alembic config.
#
# sqlalchemy.url is intentionally NOT set here: the DSN (with password) is
# injected by migrations/env.py from SgSettings (conf/config.yaml + SG_ env).
# Writing credentials into alembic.ini is a common leak path once it hits Git.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the OS locale
# encoding (GBK on Chinese Windows); non-ASCII comments crash parsing.
# Generated migration scripts themselves are UTF-8 (output_encoding below).
#
# Common commands:
#   alembic revision --autogenerate -m "add user.status"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic upgrade head --sql > migrate.sql   # offline: SQL for manual review

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamped version filenames keep ordering stable across branches
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
# Injected by env.py via set_main_option
sqlalchemy.url =

# Encoding of generated migration scripts
output_encoding = utf-8

[post_write_hooks]
# Reserved: attach ruff/black here to format generated migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
