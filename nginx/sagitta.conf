location ^~ /_int_files/ {
    internal;
    alias /data/files/;
    add_header Accept-Ranges bytes always;
    add_header Content-Disposition $arg_disp;
    limit_rate 2m;
    limit_rate_after 1m;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-Id $http_x_trace_id;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 20m;
}

location ~* \.(xlsx|csv|zip|pdf|png|jpg)$ {
    valid_referers none blocked server_names *.yourdomain.com yourcdn.com;
    if ($invalid_referer) { return 403; }
}

map $arg_token $cdn_ok { default 0; "~^[0-9a-f]{32}$" 1; }
location ^~ /cdn/ {
    internal;
    if ($cdn_ok = 0) { return 403; }
    proxy_pass http://file_store;
    proxy_force_ranges on;
}