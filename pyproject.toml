[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagittapi"
version = "0.1.0"
description = "FastAPI 工程化框架：分层约束、统一响应、多数据源、认证与文件存储开箱即用"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sagitta" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "redis>=5.0",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "aiofiles>=23.2",
]

[project.scripts]
sgcli = "sagittapi.cli:main"

[project.optional-dependencies]
pg = ["asyncpg>=0.29", "psycopg[binary]>=3.1"]
mysql = ["asyncmy>=0.2.9", "PyMySQL>=1.1"]
sqlite = ["aiosqlite>=0.20"]
s3 = ["boto3>=1.34", "aiobotocore>=2.13"]
alembic = ["alembic>=1.13"]
qdrant = ["qdrant-client>=1.9"]
loguru = ["loguru>=0.7"]
cli = ["typer>=0.12"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["sagittapi*"]
exclude = ["app*", "demo*", "sagittapi.tests*", "sagittapi.fix_summary*", "_selfcheck*"]

[tool.pytest.ini_options]
testpaths = ["sagittapi/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]